{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Form</title>
    <link rel="stylesheet" href="../static/style.css" />
    <style>
        body {
            margin: 0;
        }

        #form {
            margin: 25px;
        }

        form {
            margin: 0 auto;
            display: block;
            width: 814px;
            background-color: white;
            border: 2px solid black;
            padding: 25px;
        }

        label {
            font-size: 20px;
            text-transform: capitalize;
        }

        input[type="text"] {
            height: 15px;
            width: 150px;
            padding: 12px;
            margin: 8px;
            box-shadow: 1 1 5;
            border-radius: 10px;
            border: 2px solid rgba(48, 48, 48, 0.649);
            font-size: 18px;
        }

        input[type="file"] {
            display: none;
        }
        
        #group8 {
            border: 1px solid #ccc;
            display: flex;
            padding: 6px 12px;
            flex-wrap: wrap;
            cursor: pointer;
            width: 162px;
            height: 42px;
            align-items: center;
            justify-content: center;
        }

        #group8 * {
            margin: 5px !important;
            cursor: pointer;
        }

        select {
            margin: 5px;
            padding: 5px;
            border-radius: 10px;
        }

        .group {
            display: flex;
            gap: 20px;
        }

        button {
            width: 100px;
            height: 50px;
            background-color: #99DBF5;
            color: white;
            border-radius: 10px;
            display: block;
            margin: 10px auto;
        }
    </style>
</head>

<body>
    <nav>
        <ul>
            <li><a href="/index">Home</a></li>
            <li><a href="/rules">Rules</a></li>
            <li><a href="/submit">Submit</a></li>
            <li><a href="/awards">Awards</a></li>
            <li><a href="/submissions">Submissions</a></li>
            <li><a href="/process">Our Process</a></li>
            <li><a href="/about">About Us</a></li>
        </ul>
    </nav>
    <h1 style="text-align: center;">Submission Form</h1>
    <div id="form">

        <form action="/submit/" method="post">
            {% csrf_token %}
        </form>

        <form style="display: none;">
            {{form.as_p}}
        </form>

    </div>

    <script>
        function makeGroup(ids, count) {
            const div = document.createElement("div")
            div.classList.add("group")
            div.setAttribute("id", `group${count}`)
            document.querySelector("form").append(div)

            const group = document.querySelector(`#group${count}`)
            
            ids.forEach( id => {
                group.append(document.querySelector(`#id_${id}`).parentElement)
            })
        }
        
        makeGroup(["firstname", "lastname"], 1)
        makeGroup(["email", "phone_number"], 2)
        makeGroup(["country", "city", "zipcode"], 3)
        makeGroup(["grade_level", "birthday_month"], 4)
        makeGroup(["school_name", "school_address"], 5)
        makeGroup(["parent_firstname", "parent_lastname"], 6)
        makeGroup(["parent_email", "parent_phone_number"], 7)
        makeGroup(["pdf_id"], 8)

        button = document.createElement("button")
        button.setAttribute("type", "submit")
        button.innerText = "Submit"
        document.querySelector("form").append(button)
    </script>
</body>

</html>
