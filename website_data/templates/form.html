{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Form</title>
    <link rel="stylesheet" href="../static/style.css" />
    <style>
        body {
            margin: 0;
        }

        #form {
            margin: 25px;
        }

        label {
            font-size: 20px;
            text-transform: capitalize;
        }

        input[type="text"] {
            height: 15px;
            width: 150px;
            padding: 12px;
            margin: 8px;
            box-shadow: 1 1 5;
            border-radius: 10px;
            border: 2px solid green;
            font-size: 18px;
        }

        .name {
            display: flex;
            gap: 20px;
        }
    </style>
</head>

<body>
    <nav>
        <ul>
            <li><a href="/index">Home</a></li>
            <li><a href="/rules">Rules</a></li>
            <li><a href="/submit">Submit</a></li>
            <li><a href="/awards">Awards</a></li>
            <li><a href="/process">Our Process</a></li>
            <li><a href="/about">About Us</a></li>
        </ul>
    </nav>
    <h1 style="text-align: center;">Submission Form</h1>
    <div id="form">
        <form action="/submit/" method="post">
            {% csrf_token %}
            {{form.as_p}}
            <button type="submit">Submit</button>
        </form>
    </div>

    <script>
        document.querySelector("#id_firstname").parentElement.classList.add("firstname")
        document.querySelector("#id_lastname").parentElement.classList.add("lastname")

        const div = document.createElement("div")
        div.classList.add("name")

        document.querySelector("form").prepend(div)

        document.querySelector(".name").append(document.querySelector(".firstname"))
        document.querySelector(".name").append(document.querySelector(".lastname"))
    </script>
</body>

</html>
